spring:
    application:
        name: itau
    datasource:
        url: jdbc:mysql://localhost:3306/itau
        username: root
        password: 1234
    sql:
        init:
            mode: always

management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics
    datadog:
        metrics:
            export:
                enabled: true
                api-key: ${DD_API_KEY}
                step: 10s
                    